# Keep the pre-rename app ID so installs upgrade in place instead of appearing as a second app.
appId: cn.linkresume.desktop
productName: DrawOffer
directories:
  output: release
files:
  - dist/**
  - package.json
electronLanguages:
  - zh-CN
  - en-US
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64
